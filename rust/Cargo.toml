[workspace]
resolver = "2"

[package]
name = "tunes4r"
version = "1.0.0"
edition = "2021"

[lib]
name = "tunes4r"
crate-type = ["cdylib", "staticlib", "rlib"]

[[example]]
name = "play_stream"
path = "examples/play_stream.rs"

[[example]]
name = "yt_service"
path = "examples/yt_service.rs"

[[example]]
name = "yt_explode"
path = "examples/yt_explode.rs"

[features]
default = ["rustls-platform-verifier", "youtube"]
rustls-platform-verifier = ["dep:rustls-platform-verifier", "dep:rustls"]
classifier = []
youtube = ["tunes4r-player/youtube"]

[profile.release]
panic = "unwind"

[build-dependencies]
cbindgen = "0.29.2"

[dependencies]
tunes4r-player = { path = "../../tunes4r-core/crates/player", features = ["youtube"] }
ytex = { path = "../../ytex" }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tracing-log = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
ndk-context = "0.1"
jni = { version = "0.22", default-features = false }
android_logger = "0.15"

[target.'cfg(target_os = "android")'.dependencies.log]
version = "0.4"

[target.'cfg(target_os = "android")'.dependencies.tracing]
version = "0.1"
features = ["log"]

[dependencies.rustls-platform-verifier]
version = "0.7"
optional = true

[dependencies.rustls]
version = "0.23"
features = ["ring"]
optional = true

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["test-util", "rt-multi-thread"] }
ratatui = "0.29"
crossterm = "0.28"
eframe = { version = "0.35.0", features = ["default"] }
egui = "0.34"
egui_extras = { version = "0.35", features = ["all_loaders"] }
rfd = "0.15"
log = "0.4"
