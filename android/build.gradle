// tunes4r Android plugin build
//
// Rust .so files should be placed in:
//   src/main/jniLibs/arm64-v8a/libtunes4r.so
//   src/main/jniLibs/x86_64/libtunes4r.so
//
// Build with: make build-android

group 'com.tunes4r_player'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Auto-detect ANDROID_NDK_HOME from the default SDK path.
def ndkDir = System.env.ANDROID_NDK_HOME ?:
    "$System.env.HOME/Library/Android/sdk/ndk/28.2.13676358"

// NOTE: The Rust .so is built by Flutter's FFI plugin native-assets hook
// (driven from tunes4r_player via `make build-android` with the correct
// target ABI). Running it again here via `preBuild` causes a SECOND full
// Rust build — including the x86_64 pass that compiles the heavy `v8` crate —
// on every `flutter run` / `flutter build`. That made debug builds take ~30min.
//
// We only copy libc++_shared.so here. The .so itself is produced by the FFI
// hook. For explicit multi-ABI publishing builds, run `make build-android`
// manually (which also copies libc++_shared.so).

// Copy libc++_shared.so from the NDK into each jniLibs ABI directory.
// The Rust library links against it, so it must be bundled in the APK.
def cxxTriples = [
    'arm64-v8a': 'aarch64-linux-android',
    'x86_64'    : 'x86_64-linux-android',
]

task copyLibCxx(type: Copy) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def ndkCxxRoot = "$ndkDir/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib"
    cxxTriples.each { abi, triple ->
        from("$ndkCxxRoot/$triple") {
            include 'libc++_shared.so'
            into abi
        }
    }
    into 'src/main/jniLibs'
}

// Keep copyLibCxx available on demand, but do NOT block preBuild on a Rust
// rebuild. `flutter` already builds the native lib via the FFI hook.
// Run `./gradlew copyLibCxx` manually if the NDK .so needs refreshing.

android {
    namespace 'com.tunes4r_player.tunes4r_player'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Ensure libc++_shared.so is bundled if the Rust library depends on it
    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.9.1'
}
