// tunes4r Android plugin build
//
// Rust .so files should be placed in:
//   src/main/jniLibs/arm64-v8a/libtunes4r.so
//   src/main/jniLibs/armeabi-v7a/libtunes4r.so
//   src/main/jniLibs/x86_64/libtunes4r.so
//   src/main/jniLibs/x86/libtunes4r.so
//
// Build with: make build-android

group 'com.tunes4r_player'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Auto-build Rust .so libs before assembling.
// The script auto-detects ANDROID_NDK_HOME from the default SDK path.
def pluginRoot = project.projectDir.parentFile
def ndkDir = System.env.ANDROID_NDK_HOME ?:
    "$System.env.HOME/Library/Android/sdk/ndk/28.2.13676358"

task buildRust(type: Exec) {
    workingDir = pluginRoot
    environment 'ANDROID_NDK_HOME', ndkDir
    def buildType = gradle.startParameter.taskNames.any { it.contains('Debug') } ? 'debug' : 'release'
    commandLine 'make', 'build-android', "BUILD=$buildType"
}

// Copy libc++_shared.so from the NDK into each jniLibs ABI directory.
// The Rust library links against it, so it must be bundled in the APK.
def cxxTriples = [
    'arm64-v8a'  : 'aarch64-linux-android',
    'armeabi-v7a': 'arm-linux-androideabi',
    'x86_64'     : 'x86_64-linux-android',
    'x86'        : 'i686-linux-android',
]

task copyLibCxx(type: Copy) {
    dependsOn buildRust
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def ndkCxxRoot = "$ndkDir/toolchains/llvm/prebuilt/darwin-x86_64/sysroot/usr/lib"
    cxxTriples.each { abi, triple ->
        from("$ndkCxxRoot/$triple") {
            include 'libc++_shared.so'
            into abi
        }
    }
    into 'src/main/jniLibs'
}

preBuild.dependsOn copyLibCxx

android {
    namespace 'com.tunes4r_player.tunes4r_player'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Ensure libc++_shared.so is bundled if the Rust library depends on it
    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.9.1'
}
